name: Read-only tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'pwa/**'
      - 'protocol-fixtures/**'
      - 'tests/**'
      - 'android/**'
      - 'docs/status-contract.md'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

concurrency:
  group: read-only-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q monitor.py ha_mqtt.py tests
      - name: Verify PWA cache boundaries
        run: node --test tests/pwa-sw.test.mjs tests/session-history.test.cjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and package debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Print Android lint findings
        if: always()
        working-directory: android
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "Android lint report was not generated."
          fi
      - name: Upload owner preview APK
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'markleonfreese'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: open-akorn-debug-${{ github.event.pull_request.head.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
